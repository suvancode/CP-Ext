<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ContinueO - ID Card Verification</title>
</head>
<body>
  <div class="container">
    <h2>Welcome to BMSIT&M.</h2>
    <div class="cn-login-box">
      <h3>Enter the ID Card Number</h3>
      <form action="index.php" method="POST" id="id-card-form">
        <input type="hidden" name="task" value="loginOtp">
        <div class="input-group">
          <!-- The portal often names this input 'otp' because of the underlying loginOtp task -->
          <input type="text" name="otp" id="otp" placeholder="" autocomplete="off" required>
          <small>(Please enter the ID Card Number)</small>
        </div>
        <div class="btn-group">
          <input type="submit" class="btn" value="SUBMIT">
        </div>
      </form>
    </div>
  </div>
</body>
</html>
